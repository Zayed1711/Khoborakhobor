<svg width="480" height="96" viewBox="0 0 480 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kk-hz-crimson" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9e1c1c"/>
      <stop offset="50%" stop-color="#842323"/>
      <stop offset="100%" stop-color="#540f0f"/>
    </linearGradient>
    <linearGradient id="kk-hz-gold" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde48b"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a6e1a"/>
    </linearGradient>
    <linearGradient id="kk-hz-ivory" x1="15" y1="15" x2="65" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5eee4"/>
    </linearGradient>
    <filter id="kk-hz-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Left: Emblem Seal (80x80) -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#kk-hz-crimson)" stroke="url(#kk-hz-gold)" stroke-width="2.2" filter="url(#kk-hz-shadow)"/>
    <rect x="4.5" y="4.5" width="71" height="71" rx="16" fill="none" stroke="url(#kk-hz-gold)" stroke-opacity="0.32" stroke-width="0.8"/>
    
    <!-- Bengali 'খ' Monogram -->
    <path d="M 26 37 C 26 33 24 31 21 31 C 16 31 14 37 14 43 C 14 50 20 55 28 55 C 34 55 38 48 40 39"
          stroke="url(#kk-hz-ivory)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 40 39 C 42 49 46 55 54 55"
          stroke="url(#kk-hz-ivory)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 54 24 L 54 55" stroke="url(#kk-hz-ivory)" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M 48 24 L 61 24" stroke="url(#kk-hz-ivory)" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Golden Nib -->
    <path d="M 40 16 L 45 25 L 43 34 L 37 34 L 35 25 Z" fill="url(#kk-hz-gold)" stroke="#540f0f" stroke-width="0.6"/>
    <line x1="40" y1="17" x2="40" y2="28" stroke="#540f0f" stroke-width="0.8"/>
    <circle cx="40" cy="28" r="0.9" fill="#540f0f"/>

    <!-- Beacon Star -->
    <path d="M 64 15 Q 64 18 67 18 Q 64 18 64 21 Q 64 18 61 18 Q 64 18 64 15 Z" fill="url(#kk-hz-gold)"/>
  </g>

  <!-- Right: Typographic Identity -->
  <g transform="translate(106, 10)">
    <!-- Bengali Masthead -->
    <text x="0" y="46" font-family="'Noto Serif Bengali', 'SolaimanLipi', 'Kalpurush', 'Times New Roman', Georgia, serif" font-weight="900" font-size="44" fill="#14171d" letter-spacing="-0.02em">
      খবরাখবর
    </text>

    <!-- Subtitle Strip -->
    <g transform="translate(2, 63)">
      <line x1="0" y1="4" x2="38" y2="4" stroke="#c29547" stroke-width="1.2" opacity="0.8"/>
      <polygon points="44,4 47,1 50,4 47,7" fill="#842323"/>
      <text x="56" y="8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5" fill="#842323" letter-spacing="0.22em">
        KHOBORAKHOBOR DIGITAL
      </text>
      <polygon points="262,4 265,1 268,4 265,7" fill="#842323"/>
      <line x1="274" y1="4" x2="312" y2="4" stroke="#c29547" stroke-width="1.2" opacity="0.8"/>
    </g>
  </g>
</svg>
